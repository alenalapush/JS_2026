<!doctype html>
<html>
  <body>
    <p>Перед скриптом...</p>
    <script>
      'use strict';

      let x = +prompt('Введите число:', '');
      let n = +prompt('В какую степень возведем:', '');

      function pow(x, n) {
        return x ** n;
      }

      alert(pow(x, n));
    </script>
    <p>...После скрипта.</p>
  </body>
</html>
