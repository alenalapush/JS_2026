<!doctype html>
<html>
  <body>
    <p>Перед скриптом...</p>
    <script>
      'use strict';

      let menu = {
        width: 200,
        height: 300,
        title: 'My menu',
      };

      function multiplyNumeric(menu) {
        for (let key in menu) {
          if (typeof menu[key] == 'number') menu[key] *= 2;
        }
      }

      multiplyNumeric(menu);

      console.log(menu); // { width: 400, height: 600, title: 'My menu' }
    </script>
    <p>...После скрипта.</p>
  </body>
</html>
