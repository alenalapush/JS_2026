<!doctype html>
<html>
  <body>
    <p>Перед скриптом...</p>
    <script>
      'use strict';

      let ladder = {
        step: 0,
        up() {
          this.step++;
          return this;
        },
        down() {
          this.step--;
          return this;
        },
        showStep() {
          alert(this.step);
          return this;
        },
      };

      ladder.up().up().down().showStep().down().showStep();
    </script>
    <p>...После скрипта.</p>
  </body>
</html>
